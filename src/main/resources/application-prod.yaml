server:
  port: 8081
  host: ticketing

spring:
  application:
    name: "ticket-service"


  main:
    allow-bean-definition-overriding: true

  datasource:
    url:  jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: root@123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      #      ddl-auto: update
      show-sql: true
    properties:
      hibernate:
        default_schema: pride_ticket_mh
        format_sql: true